<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Тихие Домики — видеообложка</title>
  <style>
    html,body{min-height:100%;margin:0;background:#f4f1ea;font-family:Arial,sans-serif}
    .boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f1ea;color:#193128;text-align:center;z-index:9999}
    .boot strong{display:block;font-size:20px;margin-bottom:12px}
    .dots span{display:inline-block;width:9px;height:9px;margin:4px;border-radius:50%;background:#244a38;animation:jump .75s infinite alternate}
    .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
    @keyframes jump{to{transform:translateY(-9px);background:#a5ca40}}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><strong>Загружаем домики…</strong><div class="dots"><span></span><span></span><span></span></div></div></div>
  <script>
  (()=>{
    fetch('./index.html',{cache:'no-store'})
      .then(response=>{
        if(!response.ok)throw new Error('Не удалось загрузить страницу');
        return response.text();
      })
      .then(html=>{
        html=html.replace('</head>','<link rel="stylesheet" href="./video-effects.css?v=3"></head>');
        html=html.replace(
          '<section class="hero"><div class="wrap">',
          '<section class="hero"><video class="hero-video" autoplay muted loop playsinline preload="auto" poster="https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=2200&q=88" aria-hidden="true"><source src="https://cdn.pixabay.com/video/2021/12/07/99973-658725823_medium.mp4" type="video/mp4"></video><div class="hero-video-shade"></div><div class="wrap">'
        );
        const scriptTag='<scr'+'ipt src="./video-effects.js?v=3"></scr'+'ipt>';
        html=html.replace('</body>',scriptTag+'</body>');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error=>{
        document.getElementById('boot').innerHTML='<div><strong>Не удалось открыть сайт</strong><div>'+error.message+'</div><p><a href="./index.html" style="color:#244a38;font-weight:700">Открыть версию без видео</a></p></div>';
      });
  })();
  </script>
</body>
</html>
