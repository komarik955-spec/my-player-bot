<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тихие Домики</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f4f1ea;color:#193128;font:16px Arial,sans-serif}.loading{text-align:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin:6px;background:#244a38;animation:b 1s infinite alternate}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes b{to{transform:translateY(-10px);background:#9fc33a}}</style></head><body><div class="loading">Загружаем домики…<br><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><script>
const motionCSS="\n:root{--ease:cubic-bezier(.22,1,.36,1)}body{overflow-x:hidden}.nav{transition:top .35s var(--ease),height .35s var(--ease),background .35s ease,box-shadow .35s ease}.nav.scrolled{top:8px;height:58px;background:#fffffff7;box-shadow:0 16px 50px #10291c2b}.logo .mark{transition:transform .45s var(--ease)}.logo:hover .mark{transform:rotate(-10deg) scale(1.1)}.links a{position:relative}.links a:after{content:\"\";position:absolute;left:0;right:100%;bottom:-7px;height:2px;background:var(--dark);border-radius:9px;transition:right .35s var(--ease)}.links a:hover:after{right:0}.btn{position:relative;overflow:hidden;transition:transform .28s var(--ease),box-shadow .28s ease,filter .28s ease}.btn:hover{transform:translateY(-3px);box-shadow:0 14px 28px #10291c25;filter:brightness(1.04)}.btn:active{transform:translateY(0) scale(.98)}.btn:before{content:\"\";position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff40;left:var(--x,50%);top:var(--y,50%);transform:translate(-50%,-50%) scale(0);transition:transform .55s var(--ease);pointer-events:none}.btn:hover:before{transform:translate(-50%,-50%) scale(1.35)}.hero{position:relative;background-position:center calc(50% + var(--hero-shift,0px));will-change:background-position}.hero:after{content:\"\";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mouse-x,72%) var(--mouse-y,28%),#d9ff701c,transparent 24%)}.hero .wrap{position:relative;z-index:1}.hero .eyebrow,.hero h1,.hero .lead,.hero .search{opacity:0;transform:translateY(28px)}body.ready .hero .eyebrow{animation:heroIn .8s .12s var(--ease) forwards}body.ready .hero h1{animation:heroIn 1s .23s var(--ease) forwards}body.ready .hero .lead{animation:heroIn .9s .38s var(--ease) forwards}body.ready .hero .search{animation:heroIn 1s .52s var(--ease) forwards}body.ready .nav{animation:navIn .75s .05s var(--ease) both}@keyframes heroIn{to{opacity:1;transform:none}}@keyframes navIn{from{opacity:0;transform:translate(-50%,-25px)}to{opacity:1;transform:translate(-50%,0)}}.reveal{opacity:0;transform:translateY(42px);transition:opacity .85s var(--ease),transform .85s var(--ease)}.reveal.from-left{transform:translateX(-50px)}.reveal.from-right{transform:translateX(50px)}.reveal.scale-in{transform:scale(.92)}.reveal.visible{opacity:1;transform:none}.stagger>*{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease)}.stagger.visible>*{opacity:1;transform:none}.stagger.visible>*:nth-child(1){transition-delay:.04s}.stagger.visible>*:nth-child(2){transition-delay:.12s}.stagger.visible>*:nth-child(3){transition-delay:.20s}.stagger.visible>*:nth-child(4){transition-delay:.28s}.stagger.visible>*:nth-child(5){transition-delay:.36s}.card{will-change:transform;transform-style:preserve-3d;transition:transform .35s var(--ease),box-shadow .35s ease}.card:hover{box-shadow:0 28px 70px #19312826}.card .media img,.g img,.photo img,.darkbox>img{transition:transform 1s var(--ease)}.card:hover .media img{transform:scale(1.075)}.tag{transition:transform .35s var(--ease)}.card:hover .tag{transform:translateY(-3px)}.feature{transition:transform .35s var(--ease),box-shadow .35s ease,background .35s ease}.feature:hover{transform:translateY(-6px);box-shadow:0 18px 42px #19312818;background:white}.g{position:relative}.g:after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#10291c45);opacity:0;transition:opacity .45s ease}.g:hover:after{opacity:1}.g:hover img{transform:scale(1.07)}.review{transition:transform .35s var(--ease),box-shadow .35s ease}.review:hover{transform:translateY(-7px) rotate(-.4deg);box-shadow:0 20px 55px #1931281c}.check{transform:translateX(-12px);opacity:0;transition:transform .6s var(--ease),opacity .6s ease}.darkbox.visible .check{transform:none;opacity:1}.darkbox.visible .check:nth-child(1){transition-delay:.18s}.darkbox.visible .check:nth-child(2){transition-delay:.27s}.darkbox.visible .check:nth-child(3){transition-delay:.36s}.darkbox.visible .check:nth-child(4){transition-delay:.45s}details{transition:transform .3s var(--ease),box-shadow .3s ease}details:hover{transform:translateX(5px);box-shadow:0 12px 30px #19312813}.cta{background-position:center calc(50% + var(--cta-shift,0px));will-change:background-position}.modal{opacity:0;transition:opacity .25s ease;display:flex;visibility:hidden;pointer-events:none}.modal.on{opacity:1;visibility:visible;pointer-events:auto}.box{opacity:0;transform:translateY(24px) scale(.94);transition:opacity .4s var(--ease),transform .4s var(--ease)}.modal.on .box{opacity:1;transform:none}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.reveal,.stagger>*{opacity:1!important;transform:none!important}.hero{background-position:center!important}}\n";
const siteJS="\nconst modal=document.querySelector('#modal'),closeButton=document.querySelector('#close'),searchForm=document.querySelector('#search'),requestForm=document.querySelector('#form'),checkIn=document.querySelector('#in'),checkOut=document.querySelector('#out'),hero=document.querySelector('.hero'),cta=document.querySelector('.cta'),nav=document.querySelector('.nav'),reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nrequestAnimationFrame(()=>document.body.classList.add('ready'));\nfunction openModal(){modal.classList.add('on');document.body.style.overflow='hidden'}function hideModal(){modal.classList.remove('on');document.body.style.overflow=''}document.querySelectorAll('.open').forEach(button=>button.addEventListener('click',openModal));closeButton.addEventListener('click',hideModal);modal.addEventListener('click',event=>{if(event.target===modal)hideModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape')hideModal()});searchForm.addEventListener('submit',event=>{event.preventDefault();openModal()});requestForm.addEventListener('submit',event=>{event.preventDefault();const button=event.currentTarget.querySelector('button');button.textContent='Заявка отправлена ✓';button.disabled=true});\nconst today=new Date(),tomorrow=new Date(today),afterTomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);afterTomorrow.setDate(today.getDate()+2);const formatDate=date=>date.toISOString().slice(0,10);checkIn.min=formatDate(today);checkOut.min=formatDate(tomorrow);checkIn.value=formatDate(tomorrow);checkOut.value=formatDate(afterTomorrow);checkIn.addEventListener('change',()=>{const nextDay=new Date(checkIn.value);nextDay.setDate(nextDay.getDate()+1);checkOut.min=formatDate(nextDay);if(!checkOut.value||new Date(checkOut.value)<=new Date(checkIn.value))checkOut.value=formatDate(nextDay)});\nconst revealGroups=[...document.querySelectorAll('.head,.copy,.faq>div:first-child,.cta>div'),document.querySelector('.photo'),document.querySelector('.darkbox')].filter(Boolean);revealGroups.forEach(element=>{element.classList.add('reveal');if(element.classList.contains('photo'))element.classList.add('from-left');if(element.classList.contains('copy'))element.classList.add('from-right');if(element.classList.contains('darkbox'))element.classList.add('scale-in')});document.querySelectorAll('.cards,.features,.gallery,.reviews,.faqlist').forEach(element=>element.classList.add('stagger'));const animatedElements=document.querySelectorAll('.reveal,.stagger');if(reduceMotion)animatedElements.forEach(element=>element.classList.add('visible'));else{const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target)}})},{threshold:.14,rootMargin:'0px 0px -40px'});animatedElements.forEach(element=>observer.observe(element))}\nlet ticking=false;function updateScrollMotion(){const y=window.scrollY;nav.classList.toggle('scrolled',y>45);if(!reduceMotion){hero.style.setProperty('--hero-shift',Math.min(y*.16,90)+'px');if(cta){const rect=cta.getBoundingClientRect(),viewport=window.innerHeight,progress=(viewport-rect.top)/(viewport+rect.height);cta.style.setProperty('--cta-shift',((progress-.5)*70)+'px')}}ticking=false}window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateScrollMotion);ticking=true}},{passive:true});updateScrollMotion();\nif(!reduceMotion){hero.addEventListener('pointermove',event=>{const rect=hero.getBoundingClientRect();hero.style.setProperty('--mouse-x',((event.clientX-rect.left)/rect.width*100)+'%');hero.style.setProperty('--mouse-y',((event.clientY-rect.top)/rect.height*100)+'%')});document.querySelectorAll('.card').forEach(card=>{card.addEventListener('pointermove',event=>{if(window.innerWidth<900)return;const rect=card.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;card.style.transform=`perspective(900px) rotateX(${-y*5}deg) rotateY(${x*7}deg) translateY(-7px)`});card.addEventListener('pointerleave',()=>card.style.transform='')});document.querySelectorAll('.btn').forEach(button=>button.addEventListener('pointermove',event=>{const rect=button.getBoundingClientRect();button.style.setProperty('--x',(event.clientX-rect.left)+'px');button.style.setProperty('--y',(event.clientY-rect.top)+'px')}))}\n";
fetch('./index.html',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('Не удалось загрузить сайт');return response.text()}).then(html=>{
 html=html.replace('</style>',motionCSS+'</style>');
 html=html.replace(/<script>[\s\S]*?<\/script>\s*<\/body>/,'<script>'+siteJS+'<\/script></body>');
 document.open();document.write(html);document.close();
}).catch(error=>{document.querySelector('.loading').innerHTML='<b>Не удалось открыть сайт</b><br><small>'+error.message+'</small>'});
</script></body></html>
